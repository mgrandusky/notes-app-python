{% extends "base.html" %}

{% block title %}{{ 'Edit Note' if note else 'New Note' }} - Notes App{% endblock %}

{% block content %}
<div class="editor-container">
    <form id="note-form" class="note-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" id="note-id" value="{{ note.id if note else '' }}">
        
        <div class="form-group">
            <input 
                type="text" 
                id="note-title" 
                name="title" 
                class="form-input form-input-large" 
                placeholder="Note Title"
                value="{{ note.title if note else '' }}"
                required
            >
        </div>
        
        <div class="form-group">
            <div id="editor-toolbar" class="editor-toolbar">
                <button type="button" class="toolbar-btn" data-command="bold" title="Bold (Ctrl+B)">
                    <strong>B</strong>
                </button>
                <button type="button" class="toolbar-btn" data-command="italic" title="Italic (Ctrl+I)">
                    <em>I</em>
                </button>
                <button type="button" class="toolbar-btn" data-command="underline" title="Underline (Ctrl+U)">
                    <u>U</u>
                </button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-command="insertUnorderedList" title="Bullet List">
                    ≡
                </button>
                <button type="button" class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
                    1.
                </button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Heading 1">
                    H1
                </button>
                <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Heading 2">
                    H2
                </button>
                <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="p" title="Paragraph">
                    P
                </button>
            </div>
            
            <div 
                id="note-content" 
                class="editor-content" 
                contenteditable="true"
                placeholder="Start writing your note..."
            >{{ note.content|safe if note else '' }}</div>
        </div>
        
        <div class="form-group">
            <label for="note-tags" class="form-label">Tags (comma-separated)</label>
            <input 
                type="text" 
                id="note-tags" 
                name="tags" 
                class="form-input" 
                placeholder="personal, work, ideas"
                value="{{ note.tags if note else '' }}"
            >
        </div>
        
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="window.location.href='{{ url_for('notes.index') }}'">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="save-btn">
                {{ 'Update Note' if note else 'Save Note' }}
            </button>
        </div>
    </form>
    
    <div id="save-status" class="save-status"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
